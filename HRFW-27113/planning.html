<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교육 담당자 설문 프로토타입</title>
<style>
  :root{
    --page-bg:#eef0f3;
    --app-bg:#f4f5f7;
    --sidebar-bg:#1c1c1c;
    --sidebar-top:#2b2b2b;
    --sidebar-text:#c7c9cd;
    --sidebar-text-active:#ffffff;
    --sidebar-active-bg:#111111;
    --accent:#2455e6;
    --accent-soft:#e8edfc;
    --surface:#ffffff;
    --border:#dcdfe4;
    --border-strong:#c7cbd3;
    --text:#12151a;
    --text-muted:#6a7282;
    --text-faint:#9aa1ab;
    --danger:#c0392b;
    --good-bg:#e9f9ef;
    --good-text:#0f7a3d;
    --warn:#a15c00;
    --radius:6px;
    --shadow:0 12px 32px rgba(15,17,20,.18);
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --page-bg:#0c0d10;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --page-bg:#0c0d10; }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-bg);
    font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    padding:28px;
    min-height:100vh;
  }
  .frame-note{
    max-width:1400px;
    margin:0 auto 12px;
    font-size:12.5px;
    color:var(--text-muted);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .frame-note b{color:var(--text);}
  .app-shell{
    max-width:1400px;
    margin:0 auto;
    display:flex;
    height:840px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(10,12,16,.28);
    border:1px solid rgba(0,0,0,.06);
    position:relative;
  }

  /* Sidebar */
  .sidebar{
    width:220px;
    flex:0 0 220px;
    background:var(--sidebar-bg);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .sidebar-brand{
    background:var(--sidebar-top);
    padding:13px 16px;
    color:#fff;
    font-weight:700;
    font-size:13px;
    letter-spacing:-.2px;
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .sidebar-brand .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    flex:0 0 auto;
  }
  .sidebar-scope{
    padding:14px 16px 6px;
    font-size:10.5px;
    letter-spacing:.06em;
    color:#7d828b;
    text-transform:uppercase;
  }
  .sidebar-nav{padding:2px 8px 16px;}
  .sidebar-item{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    text-align:left;
    padding:10px 12px;
    border-radius:6px;
    border:none;
    background:transparent;
    color:var(--sidebar-text);
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    font-family:inherit;
    margin-bottom:2px;
  }
  .sidebar-item:hover{background:rgba(255,255,255,.06);}
  .sidebar-item.active{
    background:var(--sidebar-active-bg);
    color:var(--sidebar-text-active);
    font-weight:700;
  }
  .sidebar-item .ic{width:16px;text-align:center;flex:0 0 auto;font-size:13px;}
  .sidebar-foot{
    margin-top:auto;
    padding:14px 16px;
    font-size:10.5px;
    color:#5b5f66;
    border-top:1px solid rgba(255,255,255,.06);
  }

  /* Main */
  .main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    background:var(--app-bg);
    min-width:0;
  }
  .topbar{
    flex:0 0 auto;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:9px 22px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:14px;
    font-size:11.5px;
    color:var(--text-muted);
  }
  .topbar .company-pill{
    font-weight:700;
    color:var(--text);
    background:var(--accent-soft);
    color:#1d3fb0;
    padding:3px 10px;
    border-radius:20px;
    font-size:11px;
  }
  .topbar button.link{
    background:none;border:none;color:var(--text-muted);
    font:inherit;cursor:pointer;padding:2px 4px;
  }
  .topbar button.link:hover{color:var(--text);}
  .topbar button.link:focus-visible, .sidebar-item:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  .view-head{
    flex:0 0 auto;
    padding:20px 26px 4px;
  }
  .view-head .eyebrow{
    font-size:11px;color:var(--text-muted);letter-spacing:.03em;margin-bottom:4px;
  }
  .view-head h1{
    margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px;text-wrap:balance;
  }
  .view-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 26px 28px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:16px;
  }
  .card-pad{padding:16px 18px;}

  .filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .filter-row label{font-size:12.5px;font-weight:700;color:var(--text);}
  input[type=text], input[type=date], input[type=datetime-local], select{
    font:inherit;font-size:12.5px;
    padding:7px 10px;
    border:1px solid var(--border-strong);
    border-radius:5px;
    background:#fff;
    color:var(--text);
  }
  input:disabled, select:disabled{
    background:#f0f1f3;
    color:var(--text-faint);
    border-color:var(--border);
    cursor:not-allowed;
  }
  .btn{
    font:inherit;font-size:12.5px;font-weight:700;
    padding:8px 16px;border-radius:5px;border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn-primary{background:var(--text);color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn-ghost{background:#fff;border-color:var(--border-strong);color:var(--text);}
  .btn-ghost:hover{background:#f2f3f5;}
  .btn-sm{padding:5px 11px;font-size:11.5px;}
  .btn-danger-ghost{background:#fff;border-color:#eecfc9;color:var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .table-wrap{overflow-x:auto;}
  thead th{
    text-align:left;font-weight:700;color:var(--text);
    background:#f7f8fa;border-bottom:1px solid var(--border);
    padding:10px 12px;white-space:nowrap;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:#fafbfd;}
  .muted-note{padding:12px;font-size:11.5px;color:var(--text-muted);}
  .pill{
    display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
  }
  .pill-on{background:var(--good-bg);color:var(--good-text);}
  .pill-off{background:#f1f2f4;color:var(--text-muted);}
  td.num{font-variant-numeric:tabular-nums;}

  .form-row{
    display:flex;border-bottom:1px solid var(--border);padding:14px 18px;
  }
  .form-row:last-child{border-bottom:none;}
  .form-row .flabel{
    flex:0 0 168px;font-weight:700;font-size:12.5px;padding-top:7px;
  }
  .form-row .fvalue{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;}
  .fvalue .row-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hint{font-size:11px;color:var(--text-muted);}
  .hint.warn{color:var(--warn);}
  input.wide{width:100%;max-width:520px;}
  .radio{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;}
  .radio input{margin:0;}
  .readonly-value{font-size:12.5px;padding-top:7px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:#f2f3f5;border:1px solid var(--border);
    border-radius:20px;padding:4px 10px;font-size:11.5px;
  }
  .chip button{border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:12px;padding:0;line-height:1;}
  .chip button:hover{color:var(--danger);}
  .empty-chip{font-size:11.5px;color:var(--text-faint);}

  .btn-row{display:flex;gap:8px;padding-top:18px;}

  /* Overlay / modal */
  .overlay{
    position:absolute;inset:0;
    background:rgba(10,12,16,.5);
    display:flex;align-items:center;justify-content:center;
    z-index:40;
    animation:fadeIn .12s ease-out;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .overlay[hidden]{display:none;}
  .modal{
    background:#fff;border-radius:14px;box-shadow:var(--shadow);
    width:440px;max-width:90vw;padding:26px 26px 22px;
    position:relative;
  }
  .modal.wide{width:560px;}
  .modal-close{
    position:absolute;top:14px;right:16px;border:none;background:none;
    font-size:18px;color:var(--text-muted);cursor:pointer;line-height:1;
  }
  .modal h2{margin:6px 0 4px;font-size:17px;text-align:center;}
  .modal p.desc{margin:0 0 16px;font-size:12.5px;color:var(--text-muted);text-align:center;line-height:1.55;}
  .survey-emoji{font-size:38px;text-align:center;margin-bottom:2px;}
  .choice-btn{
    width:100%;padding:12px;border:none;border-radius:10px;
    font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:8px;
    font-family:inherit;
  }
  .choice-good{background:#e6f8ee;color:#0f7a3d;}
  .choice-bad{background:#fdecec;color:#b23327;}
  .choice-next{background:var(--text);color:#fff;}
  .choice-next:disabled{opacity:.4;cursor:not-allowed;}
  .opt-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
  .opt-item{
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--border);border-radius:8px;padding:9px 10px;
    font-size:12.5px;cursor:pointer;
  }
  .opt-item input{margin:0;}
  .modal textarea{
    width:100%;min-height:60px;border:1px solid var(--border);border-radius:8px;
    padding:8px;font:inherit;font-size:12px;resize:vertical;margin-bottom:12px;
  }
  .dont-show{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);justify-content:center;margin-top:4px;}
  .modal-search{display:flex;gap:8px;margin-bottom:12px;}
  .modal-search input{flex:1;}
  .person-list{border:1px solid var(--border);border-radius:8px;max-height:220px;overflow-y:auto;margin-bottom:10px;}
  .person-row{
    display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:12.5px;
    border-bottom:1px solid var(--border);cursor:pointer;
  }
  .person-row:last-child{border-bottom:none;}
  .person-row:hover{background:#f7f8fa;}
  .person-row .pname{font-weight:700;min-width:64px;}
  .person-row .pid{color:var(--text-muted);}
  .person-row .pdept{color:var(--text-faint);margin-left:auto;font-size:11px;}

  .toast-wrap{
    position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .toast{
    background:#12151a;color:#fff;padding:10px 18px;border-radius:20px;
    font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);
    animation:toastIn .18s ease-out;
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .learner-page{
    background:#fff;border:1px solid var(--border);border-radius:8px;
    padding:32px;min-height:420px;
  }
  .learner-page h2{margin:0 0 6px;font-size:18px;}
  .learner-block{
    height:64px;border-radius:6px;background:#f2f3f5;margin-bottom:14px;
  }

  @media (prefers-reduced-motion: reduce){
    .overlay, .toast{animation:none;}
  }
</style>

<div class="frame-note">
  <span><b>HRFW-27113</b> 교육 담당자 설문 기능 — 정책서·기획서 기반 동작 프로토타입 (임시 데이터, 실제 서버 연동 없음)</span>
</div>

<div class="app-shell" id="app">

  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span>교육운영관리시스템</div>
    <div class="sidebar-scope">개별 기업 에듀매니저</div>
    <nav class="sidebar-nav" id="sidebarNavTenant"></nav>
    <div class="sidebar-scope">0번 기업 에듀매니저</div>
    <nav class="sidebar-nav" id="sidebarNavRoot"></nav>
    <div class="sidebar-foot">메뉴 클릭 시 해당 기업 컨텍스트로 자동 전환됩니다.</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span id="companyLabel" class="company-pill">UX레벨업 (개발용) · 21320</span>
      <button class="link" id="btnSwitchCompany">기업변경</button>
      <button class="link">로그아웃</button>
    </div>

    <div class="view-head">
      <div class="eyebrow" id="viewEyebrow">교육 담당자 설문 관리</div>
      <h1 id="viewTitle">목록</h1>
    </div>
    <div class="view-body" id="viewBody"></div>
  </div>

  <div class="overlay" id="overlaySurvey" hidden></div>
  <div class="overlay" id="overlayPerson" hidden></div>
  <div class="overlay" id="overlayQuestion" hidden></div>
  <div class="overlay" id="overlayBulk" hidden></div>
  <div class="toast-wrap" id="toastWrap"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- mock data ---------- */
  var EDU_ROLE_LIST = [
    {name:"홍길동", id:"hong01", dept:"교육운영팀"},
    {name:"김담당", id:"kim22", dept:"인재개발팀"},
    {name:"이매니저", id:"lee15", dept:"경영지원팀"},
    {name:"박운영", id:"park09", dept:"HR지원팀"}
  ];

  var uid = 100;
  function nextId(){ return uid++; }

  /* 문항 코드 — 설문 일괄등록 엑셀에서 문항을 코드로 참조할 수 있도록 문항마다 고유 코드 부여 */
  var qCodeSeq = 0;
  function nextQCode(){ qCodeSeq++; return "Q" + String(qCodeSeq).padStart(3,"0"); }

  /* 관리자 화면 표기용 — "긍정/부정"이라는 정식 분류처럼 오해되지 않도록, 실제 팝업 버튼 문구에 맞춘 평문 사용 */
  function catLabel(cat){ return cat === "good" ? "도움됨" : "아쉬움"; }

  /* 문항(이유) 풀 — survey_popup.html 목업의 good/bad 리스트 기반. 긍정/부정으로만 분류하고
     각 설문은 이 풀에서 문항을 "선택"해서 붙여쓴다 (문항 자체를 새로 만드는 게 아니라 재사용). */
  function seedQuestionPool(){
    return [
      {id: nextId(), code: nextQCode(), category:"good", content:"원하는 콘텐츠를 쉽게 찾을 수 있었어요.", active:true},
      {id: nextId(), code: nextQCode(), category:"good", content:"메뉴 구성이 편리했어요.", active:true},
      {id: nextId(), code: nextQCode(), category:"good", content:"UI가 보기 쉬워졌어요.", active:true},
      {id: nextId(), code: nextQCode(), category:"good", content:"원하는 기능을 빠르게 찾을 수 있었어요.", active:true},
      {id: nextId(), code: nextQCode(), category:"bad", content:"원하는 메뉴를 찾기 어려웠어요.", active:true},
      {id: nextId(), code: nextQCode(), category:"bad", content:"메뉴 구성이 복잡했어요.", active:true},
      {id: nextId(), code: nextQCode(), category:"bad", content:"원하는 기능이 없었어요.", active:true},
      {id: nextId(), code: nextQCode(), category:"bad", content:"오류가 발생했어요.", active:true}
    ];
  }
  var QUESTION_POOL = seedQuestionPool();
  function findQuestion(id){
    for (var i=0;i<QUESTION_POOL.length;i++) if (QUESTION_POOL[i].id === id) return QUESTION_POOL[i];
    return null;
  }
  function countSurveysUsing(qid){
    return surveys.filter(function(s){ return s.questionIds.indexOf(qid) > -1; }).length;
  }
  function downloadQuestionCodeList(){
    var lines = ["문항코드,구분,문항내용,사용여부"];
    QUESTION_POOL.forEach(function(q){
      lines.push([q.code, catLabel(q.category), '"'+q.content+'"', q.active?"사용":"미사용"].join(","));
    });
    var blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8;"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "기등록_설문문항_코드목록.csv";
    document.body.appendChild(a); a.click(); a.remove();
    toast("등록된 문항 코드 목록을 다운로드했습니다. 설문 일괄등록 엑셀에서 이 코드로 문항을 지정하세요.");
  }

  function seedSurveys(){
    return [
      {
        id: nextId(),
        title: "2026년 하반기 커스텀 개선 만족도 조사",
        desc: "신규 커스텀 완료 후 만족도 확인",
        managerName: "홍길동", managerId: "hong01",
        startAt: "2026-07-01T09:00", endAt: "2026-07-31T18:00",
        menuUrl: "/Manage/Home",
        expose: true,
        targets: [
          {name:"홍길동", id:"hong01"},
          {name:"김담당", id:"kim22"},
          {name:"이매니저", id:"lee15"}
        ],
        participants: 12,
        questionIds: QUESTION_POOL.map(function(q){ return q.id; })
      }
    ];
  }
  var surveys = seedSurveys();
  var currentSurveyId = surveys[0].id;

  /* 0번 기업 "교육 담당자 전체 설문 결과" — 설문 단위가 아니라 응답 단위로 전 기업 결과를 모아 다운로드 */
  var allCompanyResults = [
    {company:"SPC GFS (66911)", title:"2026년 하반기 커스텀 개선 만족도 조사", managerName:"홍길동", managerId:"hong01", respondedAt:"2026-07-03 10:12", summary:"도움됨 — 메뉴 구성이 편리했어요."},
    {company:"SPC GFS (66911)", title:"2026년 하반기 커스텀 개선 만족도 조사", managerName:"김담당", managerId:"kim22", respondedAt:"2026-07-05 15:41", summary:"아쉬움 — 원하는 기능이 없었어요."},
    {company:"UX레벨업 (21320)", title:"신규 UI 개편 만족도 조사", managerName:"김담당", managerId:"kim07", respondedAt:"2026-06-20 09:03", summary:"도움됨 — UI가 보기 쉬워졌어요."}
  ];

  /* ---------- app state ---------- */
  var state = {
    company: "tenant", // "tenant" | "root"
    view: "s-list",    // s-list, s-register, s-edit, s-view, q-list, q-register, q-edit, q-view, all-list
    editingSurveyId: null,
    viewingSurveyId: null,
    editingQuestionId: null,
    viewingQuestionId: null,
    targetDraft: [],       // chips being edited in a survey form
    questionDraft: [],     // question ids selected in a survey form
    personSearchOpenFor: null // "register" | "edit"
  };

  var els = {
    sidebarNavTenant: document.getElementById("sidebarNavTenant"),
    sidebarNavRoot: document.getElementById("sidebarNavRoot"),
    companyLabel: document.getElementById("companyLabel"),
    viewEyebrow: document.getElementById("viewEyebrow"),
    viewTitle: document.getElementById("viewTitle"),
    viewBody: document.getElementById("viewBody"),
    overlaySurvey: document.getElementById("overlaySurvey"),
    overlayPerson: document.getElementById("overlayPerson"),
    overlayQuestion: document.getElementById("overlayQuestion"),
    overlayBulk: document.getElementById("overlayBulk"),
    toastWrap: document.getElementById("toastWrap")
  };

  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    els.toastWrap.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function isActiveGroup(m){
    if (m.group === "survey") return state.view.indexOf("s-") === 0;
    if (m.group === "question") return state.view.indexOf("q-") === 0;
    if (m.group === "all-results") return state.view === "all-results";
    if (m.group === "learner") return state.view === "learner-view";

    setCompany(state.company === "tenant" ? "root" : "tenant");

  /* ---------- routing ---------- */
  function go(view, opts, company){
    opts = opts || {};
    if (company && company !== state.company) setCompany(company);
    state.view = view;
    if (opts.surveyId !== undefined) state.viewingSurveyId = state.editingSurveyId = opts.surveyId;
    if (opts.questionId !== undefined) state.viewingQuestionId = state.editingQuestionId = opts.questionId;
    renderSidebar();
    renderView();
  }

  function findSurvey(id){
    for (var i=0;i<surveys.length;i++) if (surveys[i].id === id) return surveys[i];
    return null;
  }

  /* ---------- view rendering ---------- */
  function renderView(){
    var v = state.view;
    if (v === "s-list") return renderSurveyList();
    if (v === "s-register") return renderSurveyForm(null);
    if (v === "s-edit") return renderSurveyForm(findSurvey(state.editingSurveyId));
    if (v === "s-view") return renderSurveyView(findSurvey(state.viewingSurveyId));
    if (v === "q-list") return renderQuestionList();
    if (v === "q-register") return renderQuestionForm(null);
    if (v === "q-edit") return renderQuestionForm(findQuestion(state.editingQuestionId));
    if (v === "all-results") return renderAllResults();
    if (v === "learner-view") return renderLearnerView();
  }

             startAt:"2026-08-01T09:00", endAt:"2026-08-31T18:00", menuUrl:"/Manage/Home", expose:true,
             targets:[{name:"박운영", id:"park09"}], questionIds:allQ, participants:0},

  function applySurveyFilter(){
    var kind = document.getElementById("fKind").value;
    var q = document.getElementById("fQuery").value.trim().toLowerCase();
    var from = document.getElementById("fFrom").value;
    var to = document.getElementById("fTo").value;
    if (from && to && from > to){ toast("검색 시작일이 종료일보다 늦습니다."); return; }
    var rows = els.viewBody.querySelectorAll("#surveyRows tr");
    var shown = 0;
    rows.forEach(function(tr){
      var s = findSurvey(Number(tr.dataset.id));
      var sStart = s.startAt.slice(0,10), sEnd = s.endAt.slice(0,10);
      var inRange = (!from || sEnd >= from) && (!to || sStart <= to);
      var matchQuery = !q || (kind === "title"
        ? s.title.toLowerCase().indexOf(q) > -1
        : s.targets.some(function(p){ return p.name.toLowerCase().indexOf(q) > -1 || p.id.toLowerCase().indexOf(q) > -1; }));
      var match = inRange && matchQuery;
      tr.style.display = match ? "" : "none";
      if (match) shown++;
    });
    toast("검색 결과: " + shown + "건");
  }

  function fmtRange(a,b,untilResponded){
    if (untilResponded) return esc(a.replace("T"," ")) + " ~ 응답 완료 시까지";
    return esc(a.replace("T"," ")) + " ~ " + esc(b.replace("T"," "));
  }

  /* 대상지정 교육담당자가 여러 명일 수 있으므로, 목록에서는 앞 2명만 보여주고 나머지는
     "외 N명"으로 축약 — 전체 명단은 title 속성(hover)과 보기 화면에서 확인 가능 */
  function fmtTargetsCell(targets){
    if (!targets || !targets.length) return '<span class="empty-chip">미지정</span>';
    var names = targets.map(function(p){ return p.name+'('+p.id+')'; });
    var shown = names.slice(0,2).join(", ");
    var more = names.length > 2 ? ' 외 '+(names.length-2)+'명' : '';
    var full = esc(names.join(", "));
    return '<span title="'+full+'">'+esc(shown)+esc(more)+'</span>';
  }

  function downloadSurveyResult(s){
    var lines = ["교육담당자ID,교육담당자명,설문제목,응답일시,문항별응답"];
    lines.push([s.managerId, s.managerName, '"'+s.title+'"', s.endAt.replace("T"," "), '"만족도: 도움됨 / 척도: 5 / 의견: 좋아요"'].join(","));
    var blob = new Blob(["﻿" + lines.join("\n")], {type:"text/csv;charset=utf-8;"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = s.title.replace(/[^\w가-힣]+/g,"_") + "_결과.csv";
    document.body.appendChild(a); a.click(); a.remove();
    toast('"' + s.title + '" 결과를 다운로드했습니다.');
  }

    return '<div class="form-row"><div class="flabel">'+esc(label)+'</div><div class="fvalue">'+contentHtml+'</div></div>';

  function radioPair(name, onLabel, offLabel, onDefault){
    return '<div class="row-inline">' +
      '<label class="radio"><input type="radio" name="'+name+'" value="on" '+(onDefault?"checked":"")+'>'+onLabel+'</label>' +
      '<label class="radio"><input type="radio" name="'+name+'" value="off" '+(!onDefault?"checked":"")+'>'+offLabel+'</label>' +

  function renderTargetChips(){
    var wrap = document.getElementById("targetChips");
    if (!wrap) return;
    if (!state.targetDraft.length){
      wrap.innerHTML = '<span class="empty-chip">선택된 교육담당자가 없습니다</span>';
      return;
    }
    wrap.innerHTML = state.targetDraft.map(function(p,idx){
      return '<span class="chip">'+esc(p.name)+'('+esc(p.id)+') <button data-idx="'+idx+'" title="제거">✕</button></span>';
    }).join("");
    wrap.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        state.targetDraft.splice(Number(b.dataset.idx),1);
        renderTargetChips();
      });
    });

  function renderQuestionChips(){
    var wrap = document.getElementById("questionChips");
    if (!wrap) return;
    if (!state.questionDraft.length){
      wrap.innerHTML = '<span class="empty-chip">선택된 문항이 없습니다</span>';
      return;

    wrap.innerHTML = state.questionDraft.map(function(qid, idx){

      if (!q) return "";
      return '<span class="chip">['+catLabel(q.category)+'] '+esc(q.code)+' '+esc(q.content)+' <button data-idx="'+idx+'" title="제거">✕</button></span>';
    }).join("");
    wrap.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        state.questionDraft.splice(Number(b.dataset.idx),1);
        renderQuestionChips();
      });
    });

  function saveSurvey(existing){
    var title = document.getElementById("fTitle").value.trim();
    if (!title){ toast("제목을 입력하세요."); return; }
    if (!state.questionDraft.length){ toast("문항을 1개 이상 선택하세요."); return; }
    if (!state.targetDraft.length){ toast("대상 교육담당자를 1명 이상 선택하세요."); return; }
    var desc = document.getElementById("fDesc").value.trim();
    var url = document.getElementById("fUrl").value.trim() || "/Manage/Home";
    var start = document.getElementById("fStart").value.trim().replace(" ","T");
    var end = document.getElementById("fEnd").value.trim().replace(" ","T");
    var untilResponded = document.getElementById("fUntilResponded").checked;
    var expose = document.querySelector('input[name=expose]:checked').value === "on";

    if (existing){
      existing.title = title; existing.desc = desc; existing.menuUrl = url;
      existing.startAt = start; existing.endAt = end;
      existing.untilResponded = untilResponded;
      existing.expose = expose;
      existing.targets = state.targetDraft.slice();
      existing.questionIds = state.questionDraft.slice();
      toast('"'+title+'" 저장되었습니다.');
      go("s-list");
    } else {
      var s = {
        id: nextId(), title:title, desc:desc, menuUrl:url, startAt:start, endAt:end,
        untilResponded:untilResponded,
        expose:expose, targets: state.targetDraft.slice(), questionIds: state.questionDraft.slice(),
        managerName: state.targetDraft[0] ? state.targetDraft[0].name : "미지정",
        managerId: state.targetDraft[0] ? state.targetDraft[0].id : "-",
        participants: 0
      };
      surveys.push(s);
      currentSurveyId = s.id;
      toast('"'+title+'" 등록되었습니다.');
      go("s-list");
    }
  }

  /* ---- 교육 담당자 전체 설문 결과 (0번 기업) — 기간만 선택해서 바로 다운로드 (목록 렌더링 없음) ----
     화면에 전체 데이터를 리스트로 그리면 기업 수가 많아질수록 조회 자체가 느려지고 부하가 커진다.
     그래서 조건만 고르고 바로 다운로드하는 방식으로 처리 — 미리보기 테이블 없음(단, 몇 건이 잡히는지는
     가벼운 카운트만 미리 보여준다 — 조건에 맞는 게 0건인지도 모른 채 다운로드 버튼을 누르게 하지 않기 위함).
     기업 선택은 넣지 않음: 다운로드 후 엑셀에서 기업명 컬럼으로 얼마든지 걸러낼 수 있어 화면에 선택 UI를
     따로 둘 실익이 없음. 담당자도 필터로 넣지 않음: 전사 통계가 목적이라 "누가"가 아니라 "무슨 응답이
     얼마나"가 중요하고, 특정 담당자 응답이 궁금한 경우는 개별 기업의 "교육 담당자 설문 관리 > 보기"에서
     확인하는 영역이라 제외. */
  function filterAllResultsByDate(from, to){
    return allCompanyResults.filter(function(r){
      var d = r.respondedAt.slice(0,10);
      if (from && d < from) return false;
      if (to && d > to) return false;
      return true;
    });
  }

  function renderAllResults(){
    setHead("교육 담당자 전체 설문 결과");
    els.viewBody.innerHTML =
      '<div class="card card-pad">' +
        '<div class="filter-row">' +
          '<label>응답 기간</label>' +
          '<input type="date" id="arFrom" value="2026-06-01"> <span>~</span> ' +
          '<input type="date" id="arTo" value="2026-07-22">' +
        '</div>' +
      '</div>' +
      '<div class="card card-pad" style="display:flex;align-items:center;justify-content:space-between;">' +
        '<div>' +
          '<div style="font-weight:700;font-size:13px;margin-bottom:4px;">선택한 기간으로 바로 다운로드</div>' +
          '<p class="hint" id="arCount" style="margin:0;">건수 확인 중…</p>' +
        '</div>' +
        '<button class="btn btn-primary" id="btnResultsDl" style="flex:0 0 auto;">엑셀 다운로드</button>' +
      '</div>';

    var elFrom = document.getElementById("arFrom");
    var elTo = document.getElementById("arTo");
    var elCount = document.getElementById("arCount");

    function updateCount(){
      var from = elFrom.value, to = elTo.value;
      if (from && to && from > to){
        elCount.textContent = "시작일이 종료일보다 늦습니다. 기간을 다시 확인하세요.";
        elCount.classList.add("warn");
        return null;
      }
      elCount.classList.remove("warn");
      var n = filterAllResultsByDate(from, to).length;
      elCount.textContent = "현재 조건으로 " + n + "건이 다운로드됩니다. (화면에 목록을 띄우지 않아 조회 부하는 없습니다)";
      return n;
    }
    updateCount();
    elFrom.addEventListener("change", updateCount);
    elTo.addEventListener("change", updateCount);

    document.getElementById("btnResultsDl").addEventListener("click", function(){
      var from = elFrom.value, to = elTo.value;
      if (from && to && from > to){ toast("시작일이 종료일보다 늦습니다. 기간을 다시 확인하세요."); return; }
      var filtered = filterAllResultsByDate(from, to);
      if (!filtered.length){ toast("조건에 맞는 응답이 없습니다."); return; }
      var lines = ["기업명,설문제목,교육담당자명,교육담당자ID,응답일시,응답요약"];
      filtered.forEach(function(r){ lines.push([r.company,'"'+r.title+'"',r.managerName,r.managerId,r.respondedAt,'"'+r.summary+'"'].join(",")); });
      var blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8;"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "교육담당자_전체설문결과.csv";
      document.body.appendChild(a); a.click(); a.remove();
      toast(filtered.length + "건 다운로드했습니다. (모의 데이터)");
    });
  }

      document.querySelectorAll("#qpList input[type=checkbox]").forEach(function(cb){
        cb.addEventListener("change", function(){ selection[Number(cb.dataset.id)] = cb.checked; });
      });
      document.querySelectorAll("#qpList .person-row").forEach(function(r){
        r.addEventListener("click", function(e){
          if (e.target.tagName === "INPUT") return;
          var cb = r.querySelector("input"); cb.checked = !cb.checked;
          selection[Number(cb.dataset.id)] = cb.checked;
        });
      });
    }
    renderList("");
    document.getElementById("qpSearch").addEventListener("input", function(){ renderList(this.value); });
    document.getElementById("qpClose").addEventListener("click", closeQuestionPicker);
    document.getElementById("qpCancel").addEventListener("click", closeQuestionPicker);
    document.getElementById("qpNew").addEventListener("click", function(){
      closeQuestionPicker();
      go("q-register");
    });
    document.getElementById("qpConfirm").addEventListener("click", function(){
      state.questionDraft = QUESTION_POOL.filter(function(q){ return selection[q.id]; }).map(function(q){ return q.id; });
      renderQuestionChips();
      closeQuestionPicker();
      toast(state.questionDraft.length + "개 문항이 선택되었습니다.");
    });
  }
  function closeQuestionPicker(){ els.overlayQuestion.hidden = true; els.overlayQuestion.innerHTML = ""; }

  /* ---------- 팝업: 엑셀 일괄등록 (설문/문항 공용) ---------- */
  function openBulkUploadModal(opts){
    var overlay = els.overlayBulk;
    var chosenFileName = null;
    overlay.innerHTML =
      '<div class="modal">' +
        '<button class="modal-close" id="bkClose">✕</button>' +
        '<h2 style="font-size:16px;">'+esc(opts.title)+'</h2>' +
        '<p class="desc">'+esc(opts.hint)+'</p>' +
        (opts.extraButton ?
          '<div class="row-inline" style="justify-content:center;margin-bottom:10px;">' +
            '<button class="btn btn-ghost btn-sm" id="bkExtra">'+esc(opts.extraButton.label)+'</button>' +
          '</div>'
        : "") +
        '<div class="row-inline" style="justify-content:center;margin-bottom:10px;">' +
          '<button class="btn btn-ghost btn-sm" id="bkFileBtn">파일 선택</button>' +
          '<span class="hint" id="bkFileName">선택된 파일 없음</span>' +
        '</div>' +
        '<div class="row-inline" style="justify-content:center;margin-bottom:16px;">' +
          '<button class="btn btn-ghost btn-sm" id="bkSample">샘플 다운로드</button>' +
        '</div>' +
        '<input type="file" id="bkFileInput" accept=".xlsx,.xls,.csv" style="display:none;">' +
        '<button class="choice-btn choice-next" id="bkConfirm" disabled>업로드</button>' +
        '<button class="btn btn-ghost" id="bkCancel" style="width:100%;justify-content:center;">취소</button>' +
      '</div>';
    overlay.hidden = false;
    if (opts.extraButton){
      document.getElementById("bkExtra").addEventListener("click", opts.extraButton.onClick);
    }

    var fileInput = document.getElementById("bkFileInput");
    document.getElementById("bkFileBtn").addEventListener("click", function(){ fileInput.click(); });
    fileInput.addEventListener("change", function(){
      if (fileInput.files && fileInput.files[0]){
        chosenFileName = fileInput.files[0].name;
      } else {
        chosenFileName = "sample_upload.xlsx";
      }
      document.getElementById("bkFileName").textContent = chosenFileName;
      document.getElementById("bkConfirm").disabled = false;
    });
    document.getElementById("bkSample").addEventListener("click", function(){
      toast("샘플 양식을 다운로드했습니다. (목업)");
    });
    document.getElementById("bkClose").addEventListener("click", closeBulkUploadModal);
    document.getElementById("bkCancel").addEventListener("click", closeBulkUploadModal);
    document.getElementById("bkConfirm").addEventListener("click", function(){
      closeBulkUploadModal();
      opts.onConfirm(chosenFileName);
    });
  }
  function closeBulkUploadModal(){ els.overlayBulk.hidden = true; els.overlayBulk.innerHTML = ""; }

  /* ---------- 팝업: 설문 참여 팝업 (딤드 오버레이) ---------- */
  var DISMISS_KEY = "hrfw27113_dontShowToday";
  var lastDontShowAgain = false;
  function todayStr(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function openSurveyPopup(survey, force){
    if (!force && localStorage.getItem(DISMISS_KEY) === todayStr()){
      toast('오늘 "오늘 하루 보지 않기"를 선택해 팝업이 노출되지 않습니다. (자정 이후 다시 노출)');
      return;
    }
    var overlay = els.overlaySurvey;
    var chosen = null;
    lastDontShowAgain = false;

    var poolItems = survey.questionIds.map(findQuestion).filter(Boolean).filter(function(q){ return q.active; });
    var GOOD = poolItems.filter(function(q){ return q.category === "good"; }).map(function(q){ return q.content; }).concat(["기타"]);
    var BAD = poolItems.filter(function(q){ return q.category === "bad"; }).map(function(q){ return q.content; }).concat(["기타"]);

    function step1(){
      overlay.innerHTML =
        '<div class="modal">' +
          '<button class="modal-close" id="sClose">✕</button>' +
          '<div class="survey-emoji">🎉</div>' +
          '<h2>기능이 개선되었어요!</h2>' +
          '<p class="desc">이번 개선 기능은 어떠셨나요?<br>더 나은 서비스를 위해 의견을 들려주세요.</p>' +
          '<button class="choice-btn choice-good" id="sGood">😊 도움이 되었어요</button>' +
          '<button class="choice-btn choice-bad" id="sBad">😥 아쉬워요</button>' +
          '<label class="dont-show"><input type="checkbox" id="sDont"> 오늘 하루 보지 않기</label>' +
        '</div>';
      overlay.hidden = false;
      document.getElementById("sClose").addEventListener("click", function(){ captureDont(); closeSurveyPopup(); });
      document.getElementById("sGood").addEventListener("click", function(){ chosen="good"; captureDont(); step2(); });
      document.getElementById("sBad").addEventListener("click", function(){ chosen="bad"; captureDont(); step2(); });
    }
    function captureDont(){
      var el = document.getElementById("sDont");
      if (el) lastDontShowAgain = el.checked;
    }
    function step2(){
      var list = chosen === "good" ? GOOD : BAD;
      overlay.innerHTML =
        '<div class="modal">' +
          '<button class="modal-close" id="sClose2">✕</button>' +
          '<h2 style="font-size:15px;">'+(chosen==="good"?"어떤 점이 가장 도움이 되었나요?":"어떤 점이 가장 아쉬우셨나요?")+'</h2>' +
          '<div class="opt-list" id="optList">' + list.map(function(o,i){
            return '<label class="opt-item"><input type="checkbox" data-o="'+i+'">'+esc(o)+'</label>';
          }).join("") + '</div>' +
          '<textarea placeholder="기타 의견을 입력해주세요. (선택)"></textarea>' +
          '<button class="choice-btn choice-next" id="sSubmit">제출</button>' +
        '</div>';
      document.getElementById("sClose2").addEventListener("click", closeSurveyPopup);
      document.getElementById("sSubmit").addEventListener("click", function(){
        step3();
        survey.participants += 1;
      });
    }
    function step3(){
      overlay.innerHTML =
        '<div class="modal">' +
          '<div class="survey-emoji" style="color:#17c964;">✔</div>' +
          '<h2>소중한 의견 감사합니다.</h2>' +
          '<p class="desc">고객님의 의견을 반영하여 더 나은 서비스를 제공하겠습니다.</p>' +
          '<button class="choice-btn choice-next" id="sDone">닫기</button>' +
        '</div>';
      document.getElementById("sDone").addEventListener("click", closeSurveyPopup);
    }
    step1();
  }
  function closeSurveyPopup(){
    if (lastDontShowAgain){
      localStorage.setItem(DISMISS_KEY, todayStr());
      toast('"오늘 하루 보지 않기"가 저장되었습니다. 자정이 지나면 다시 노출됩니다.');
    }
    els.overlaySurvey.hidden = true;
    els.overlaySurvey.innerHTML = "";
    if (state.view === "s-list") renderSurveyList();
    if (state.view === "s-view") renderSurveyView(findSurvey(state.viewingSurveyId));
  }

  /* ---------- boot ---------- */
  renderSidebar();
  renderView();
})();
</script>

</html>
