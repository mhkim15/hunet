<title>Buttons — EDU Design System</title>
<style id="ds-tokens">
/* EDU Design System Design System — Monotone Token Sheet */
:root {
  /* ── Colors ── */
  --color-black:    #14161a;
  --color-gray-900: #24262b;
  --color-gray-700: #494d55;
  --color-gray-500: #6b7280;
  --color-gray-400: #9aa1ab;
  --color-gray-300: #c7cbd3;
  --color-gray-200: #dee1e6;
  --color-gray-100: #f1f2f4;
  --color-gray-50:  #f7f8fa;
  --color-white:    #FFFFFF;

  /* Semantic */
  --color-bg:          var(--color-gray-50);
  --color-surface:     var(--color-white);
  --color-border:      var(--color-gray-200);
  --color-border-dark: var(--color-gray-300);

  --color-text-primary:   var(--color-gray-900);
  --color-text-secondary: var(--color-gray-500);
  --color-text-disabled:  var(--color-gray-400);
  --color-text-inverse:   var(--color-white);

  /* Accent (replaces brand red — stays neutral) */
  --color-accent:        var(--color-black);
  --color-accent-subtle: var(--color-gray-100);
  --color-accent-hover:  var(--color-gray-700);

  /* ── Typography ── */
  --font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;

  --font-size-xs:  11px;
  --font-size-sm:  12px;
  --font-size-md:  14px;
  --font-size-lg:  16px;
  --font-size-xl:  18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 24px;

  --font-weight-regular: 400;
  --font-weight-medium:  500;
  --font-weight-semibold:600;
  --font-weight-bold:    700;

  --line-height-tight:  1.3;
  --line-height-normal: 1.5;
  --line-height-loose:  1.8;

  /* ── Spacing ── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ── Border Radius ── */
  --radius-none:   0px;
  --radius-sm:     12px;
  --radius-md:     16px;
  --radius-pill:   999px;
  --radius-circle: 50%;

  /* ── Shadows (soft, elevation 기반 — 카드는 테두리 대신 그림자로 뜬다) ── */
  --shadow-sm: 0 1px 3px rgba(15,17,20,.06);
  --shadow-md: 0 8px 24px rgba(15,17,20,.08);
  --shadow-lg: 0 20px 48px rgba(15,17,20,.16);
  --shadow-card: 0 1px 2px rgba(15,17,20,.04), 0 1px 1px rgba(15,17,20,.03);
  --shadow-card-hover: 0 12px 28px rgba(15,17,20,.10), 0 2px 6px rgba(15,17,20,.05);

  /* ── Layout ── */
  --layout-max-width:   1130px;
  --layout-gnb-height:  60px;
  --layout-sidebar-w:   150px;
  --layout-h-padding:   24px;
}

/* Base reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-family); font-size: var(--font-size-md); color: var(--color-text-primary); background: var(--color-bg); -webkit-font-smoothing: antialiased; }

</style>
<style>
  body { padding: 32px; background: var(--color-bg); }
  h2 { font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); margin-bottom: 24px; }
  .group { margin-bottom: 32px; }
  .group-label { font-size: var(--font-size-xs); font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-family); font-size: var(--font-size-md); font-weight: var(--font-weight-medium); cursor: pointer; border: none; outline: none; transition: opacity .15s; }
  .btn:hover { opacity: .8; }

  /* Variants */
  .btn-primary   { background: var(--color-black); color: var(--color-white); border-radius: var(--radius-sm); padding: 0 20px; height: 36px; }
  .btn-secondary { background: var(--color-gray-100); color: var(--color-text-primary); border-radius: var(--radius-sm); padding: 0 20px; height: 36px; }
  .btn-outline   { background: transparent; color: var(--color-text-primary); border: 1px solid var(--color-gray-300); border-radius: var(--radius-sm); padding: 0 20px; height: 36px; }
  .btn-ghost     { background: transparent; color: var(--color-text-secondary); border-radius: var(--radius-sm); padding: 0 16px; height: 36px; }
  .btn-disabled  { background: var(--color-gray-200); color: var(--color-gray-400); border-radius: var(--radius-sm); padding: 0 20px; height: 36px; pointer-events: none; }

  /* Sizes */
  .btn-sm { height: 28px; font-size: var(--font-size-sm); padding: 0 12px; }
  .btn-md { height: 36px; font-size: var(--font-size-md); padding: 0 20px; }
  .btn-lg { height: 44px; font-size: var(--font-size-lg); padding: 0 28px; }

  /* Tag/Badge */
  .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: var(--font-size-xs); font-weight: 600; font-family: var(--font-family); }
  .tag-dark   { background: var(--color-black);   color: var(--color-white); }
  .tag-mid    { background: var(--color-gray-500); color: var(--color-white); }
  .tag-light  { background: var(--color-gray-200); color: var(--color-gray-700); }
  .tag-outline{ background: transparent; border: 1px solid var(--color-gray-300); color: var(--color-gray-700); }
</style>
<body>
  <h2>Buttons</h2>

  <div class="group">
    <div class="group-label">Variants</div>
    <div class="row">
      <!-- ds-template:Buttons.btn-primary -->
      <button class="btn btn-primary" data-ds-field="label">더보기</button>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.btn-secondary -->
      <button class="btn btn-secondary" data-ds-field="label">관심분야 설정</button>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.btn-outline -->
      <button class="btn btn-outline" data-ds-field="label">모바일 APP 설치 안내</button>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.btn-ghost -->
      <button class="btn btn-ghost" data-ds-field="label">더보기 ›</button>
      <!-- /ds-template -->
      <button class="btn btn-disabled">비활성화</button>
    </div>
  </div>

  <div class="group">
    <div class="group-label">Sizes</div>
    <div class="row">
      <button class="btn btn-primary btn-sm">소형 버튼</button>
      <button class="btn btn-primary btn-md">중형 버튼</button>
      <button class="btn btn-primary btn-lg">대형 버튼</button>
    </div>
  </div>

  <div class="group">
    <div class="group-label">Status Tags / Badges</div>
    <div class="row">
      <!-- ds-template:Buttons.tag-dark -->
      <span class="tag tag-dark" data-ds-field="label">미시청</span>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.tag-mid -->
      <span class="tag tag-mid" data-ds-field="label">진행중</span>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.tag-light -->
      <span class="tag tag-light" data-ds-field="label">완료</span>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.tag-outline -->
      <span class="tag tag-outline" data-ds-field="label">IT</span>
      <!-- /ds-template -->
      <span class="tag tag-outline">영어</span>
      <span class="tag tag-outline">자기관리</span>
    </div>
  </div>

  <div class="group">
    <div class="group-label">More Link (텍스트형)</div>
    <div class="row">
      <a href="#" style="font-size:14px; color:var(--color-text-secondary); text-decoration:none; display:inline-flex; align-items:center; gap:4px;">더보기 <span style="font-size:12px;">›</span></a>
    </div>
  </div>
</body>
