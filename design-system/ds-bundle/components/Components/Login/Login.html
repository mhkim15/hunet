<!-- @dsCard group="Components" -->
<title>Login Cards — EDU Design System</title>
<style id="ds-tokens">
:root {
  --color-black:    #1c1c1e;
  --color-gray-900: #3a3a3c;
  --color-gray-700: #636366;
  --color-gray-500: #8e8e93;
  --color-gray-400: #aeaeb2;
  --color-gray-300: #c7c7cc;
  --color-gray-200: #d1d1d6;
  --color-gray-100: #e5e5ea;
  --color-gray-50:  #f2f2f7;
  --color-white:    #FFFFFF;

  --color-bg:          var(--color-gray-50);
  --color-surface:     var(--color-white);
  --color-border:      var(--color-gray-200);
  --color-border-dark: var(--color-gray-300);

  --color-text-primary:   var(--color-black);
  --color-text-secondary: var(--color-gray-500);
  --color-text-disabled:  var(--color-gray-400);
  --color-text-inverse:   var(--color-white);

  --color-accent:        var(--color-black);
  --color-accent-subtle: var(--color-gray-100);
  --color-accent-hover:  var(--color-gray-700);

  --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;

  --font-size-xs:  14px;
  --font-size-sm:  15px;
  --font-size-md:  17px;

  --font-weight-regular: 400;
  --font-weight-medium:  500;
  --font-weight-semibold:600;
  --font-weight-bold:    700;

  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-6:  24px;

  --radius-sm:     16px;
  --radius-pill:   999px;

  --shadow-card: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.05);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-family); font-size: var(--font-size-md); color: var(--color-text-primary); background: var(--color-bg); -webkit-font-smoothing: antialiased; }
</style>
<style>
  body { padding: 32px; background: var(--color-bg); display: flex; gap: 32px; }
  .label { font-size: 13px; font-weight: 600; color: var(--color-text-disabled); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }

  /* 메인 내 로그인 카드 — 로그인 게이트 없이 메인페이지 안에 로그인 폼을 그대로 심는 요청(간혹 발생) */
  .main-login { background: var(--color-surface); border: none; border-radius: var(--radius-sm); width: 320px; padding: var(--space-6); box-shadow: var(--shadow-card); }
  .ml-tag { display: block; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--color-text-disabled); margin-bottom: 6px; }
  .ml-logo { text-align: center; font-size: 20px; font-weight: 700; color: var(--color-text-primary); margin-bottom: var(--space-6); }
  .ml-field { margin-bottom: var(--space-3); }
  .ml-field label { display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .ml-field input { width: 100%; border: none; border-bottom: 1px solid var(--color-border); padding: 8px 2px; font-size: 15px; font-family: var(--font-family); color: var(--color-text-primary); background: transparent; }
  .ml-field input:focus { outline: none; border-bottom-color: var(--color-accent); }
  .ml-checks { display: flex; gap: var(--space-4); margin: var(--space-4) 0; }
  .ml-check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-text-secondary); }
  .ml-check input { width: 14px; height: 14px; }
  .ml-btn-login { width: 100%; padding: 13px; background: var(--color-accent); color: var(--color-white); border: none; border-radius: var(--radius-pill); font-size: 16px; font-weight: 600; cursor: pointer; font-family: var(--font-family); margin-bottom: var(--space-2); }
  .ml-btn-login:hover { opacity: .85; }
  .ml-btn-join { width: 100%; padding: 13px; background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-border-dark); border-radius: var(--radius-pill); font-size: 16px; font-weight: 600; cursor: pointer; font-family: var(--font-family); margin-bottom: var(--space-3); }
  .ml-btn-join:hover { background: var(--color-gray-50); }
  .ml-find { text-align: center; font-size: 13px; color: var(--color-text-secondary); }
</style>
<body>

  <div>
    <div class="label">메인 내 로그인 화면</div>
    <!-- ds-template:Login.main-login -->
    <div class="main-login">
      <span class="ml-tag" data-ds-field="tag">ONLINE</span>
      <div class="ml-logo" data-ds-field="logo">기업명</div>
      <div class="ml-field">
        <label>아이디</label>
        <input type="text" placeholder="아이디">
      </div>
      <div class="ml-field">
        <label>비밀번호</label>
        <input type="password" placeholder="비밀번호">
      </div>
      <div class="ml-checks">
        <span class="ml-check"><input type="checkbox">아이디기억</span>
        <span class="ml-check"><input type="checkbox">로그인 상태 유지</span>
      </div>
      <button class="ml-btn-login">로그인</button>
      <button class="ml-btn-join">회원가입</button>
      <div class="ml-find"><a href="#">아이디/비밀번호 찾기 ›</a></div>
    </div>
    <!-- /ds-template -->
  </div>

</body>
