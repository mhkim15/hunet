<title>Buttons — EDU Design System</title>
<style id="ds-tokens">
/* EDU Design System — v2 "Apple" Token Sheet (HIG 스타일: SF 시스템 폰트, 큰 radius,
   옅은 elevation, 시스템 블루 액센트). v1(ds-bundle/)은 그대로 두고 별도 병행 버전. */
:root {
  /* ── Colors — Apple 시스템 그레이 스케일 ── */
  --color-black:    #1c1c1e;
  --color-gray-900: #3a3a3c;
  --color-gray-700: #636366;
  --color-gray-500: #8e8e93;
  --color-gray-400: #aeaeb2;
  --color-gray-300: #c7c7cc;
  --color-gray-200: #d1d1d6;
  --color-gray-100: #e5e5ea;
  --color-gray-50:  #f2f2f7;
  --color-white:    #FFFFFF;

  /* Semantic */
  --color-bg:          var(--color-gray-50);
  --color-surface:     var(--color-white);
  --color-border:      var(--color-gray-200);
  --color-border-dark: var(--color-gray-300);

  --color-text-primary:   var(--color-black);
  --color-text-secondary: var(--color-gray-500);
  --color-text-disabled:  var(--color-gray-400);
  --color-text-inverse:   var(--color-white);

  /* Accent — 시스템 블루(Apple systemBlue). v1과 달리 v2는 액센트 컬러를 적극 사용한다. */
  --color-accent:        #007AFF;
  --color-accent-subtle: #E8F2FF;
  --color-accent-hover:  #0062CC;

  /* ── Typography — SF 시스템 폰트 스택(한글은 Noto Sans KR로 폴백) ── */
  --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;

  --font-size-xs:  12px;
  --font-size-sm:  13px;
  --font-size-md:  15px;
  --font-size-lg:  17px;
  --font-size-xl:  20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 30px;

  --font-weight-regular: 400;
  --font-weight-medium:  500;
  --font-weight-semibold:600;
  --font-weight-bold:    700;

  --line-height-tight:  1.2;
  --line-height-normal: 1.47;
  --line-height-loose:  1.8;

  /* ── Spacing ── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ── Border Radius — Apple의 크고 부드러운 "연속 곡률" 코너 느낌 ── */
  --radius-none:   0px;
  --radius-sm:     16px;
  --radius-md:     24px;
  --radius-pill:   999px;
  --radius-circle: 50%;

  /* ── Shadows — 아주 옅고 넓게, 카드는 테두리 없이 그림자만으로 뜬다 ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.03);
  --shadow-md: 0 10px 30px rgba(0,0,0,.07);
  --shadow-lg: 0 24px 56px rgba(0,0,0,.14);
  --shadow-card: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.05);
  --shadow-card-hover: 0 2px 6px rgba(0,0,0,.05), 0 20px 44px rgba(0,0,0,.10);

  /* ── Layout ── */
  --layout-max-width:   1130px;
  --layout-gnb-height:  60px;
  --layout-sidebar-w:   150px;
  --layout-h-padding:   24px;
}

/* Base reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-family); font-size: var(--font-size-md); color: var(--color-text-primary); background: var(--color-bg); -webkit-font-smoothing: antialiased; }

</style>
<style>
  body { padding: 32px; background: var(--color-bg); }
  h2 { font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); margin-bottom: 24px; }
  .group { margin-bottom: 32px; }
  .group-label { font-size: var(--font-size-xs); font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }

  /* 버튼은 캡슐(pill) 형태 — Apple의 "Get"/"Sign in with Apple"류 CTA 버튼 관례 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-family); font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); cursor: pointer; border: none; outline: none; transition: opacity .15s, transform .15s; }
  .btn:hover { opacity: .85; }
  .btn:active { transform: scale(.97); }

  /* Variants */
  .btn-primary   { background: var(--color-accent); color: var(--color-white); border-radius: var(--radius-pill); padding: 0 22px; height: 38px; }
  .btn-secondary { background: var(--color-gray-100); color: var(--color-text-primary); border-radius: var(--radius-pill); padding: 0 22px; height: 38px; }
  .btn-outline   { background: transparent; color: var(--color-accent); border: 1.5px solid var(--color-accent); border-radius: var(--radius-pill); padding: 0 22px; height: 38px; }
  .btn-ghost     { background: transparent; color: var(--color-accent); border-radius: var(--radius-pill); padding: 0 16px; height: 36px; font-weight: var(--font-weight-medium); }
  .btn-disabled  { background: var(--color-gray-200); color: var(--color-gray-400); border-radius: var(--radius-pill); padding: 0 22px; height: 38px; pointer-events: none; }

  /* Sizes */
  .btn-sm { height: 28px; font-size: var(--font-size-sm); padding: 0 12px; }
  .btn-md { height: 36px; font-size: var(--font-size-md); padding: 0 20px; }
  .btn-lg { height: 44px; font-size: var(--font-size-lg); padding: 0 28px; }

  /* Tag/Badge */
  .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: var(--font-size-xs); font-weight: 600; font-family: var(--font-family); }
  .tag-dark   { background: var(--color-black);   color: var(--color-white); }
  .tag-mid    { background: var(--color-gray-500); color: var(--color-white); }
  .tag-light  { background: var(--color-gray-200); color: var(--color-gray-700); }
  .tag-outline{ background: transparent; border: 1px solid var(--color-gray-300); color: var(--color-gray-700); }
</style>
<body>
  <h2>Buttons</h2>

  <div class="group">
    <div class="group-label">Variants</div>
    <div class="row">
      <!-- ds-template:Buttons.btn-primary -->
      <button class="btn btn-primary" data-ds-field="label">더보기</button>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.btn-secondary -->
      <button class="btn btn-secondary" data-ds-field="label">관심분야 설정</button>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.btn-outline -->
      <button class="btn btn-outline" data-ds-field="label">모바일 APP 설치 안내</button>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.btn-ghost -->
      <button class="btn btn-ghost" data-ds-field="label">더보기 ›</button>
      <!-- /ds-template -->
      <button class="btn btn-disabled">비활성화</button>
    </div>
  </div>

  <div class="group">
    <div class="group-label">Sizes</div>
    <div class="row">
      <button class="btn btn-primary btn-sm">소형 버튼</button>
      <button class="btn btn-primary btn-md">중형 버튼</button>
      <button class="btn btn-primary btn-lg">대형 버튼</button>
    </div>
  </div>

  <div class="group">
    <div class="group-label">Status Tags / Badges</div>
    <div class="row">
      <!-- ds-template:Buttons.tag-dark -->
      <span class="tag tag-dark" data-ds-field="label">미시청</span>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.tag-mid -->
      <span class="tag tag-mid" data-ds-field="label">진행중</span>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.tag-light -->
      <span class="tag tag-light" data-ds-field="label">완료</span>
      <!-- /ds-template -->
      <!-- ds-template:Buttons.tag-outline -->
      <span class="tag tag-outline" data-ds-field="label">IT</span>
      <!-- /ds-template -->
      <span class="tag tag-outline">영어</span>
      <span class="tag tag-outline">자기관리</span>
    </div>
  </div>

  <div class="group">
    <div class="group-label">More Link (텍스트형)</div>
    <div class="row">
      <a href="#" style="font-size:14px; color:var(--color-text-secondary); text-decoration:none; display:inline-flex; align-items:center; gap:4px;">더보기 <span style="font-size:12px;">›</span></a>
    </div>
  </div>
</body>
